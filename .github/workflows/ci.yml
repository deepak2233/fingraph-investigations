name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: ruff check api pipeline ml tests scripts/verify_stack.py scripts/export_workbench.py scripts/smoke_public.py
      - run: ruff format --check api pipeline ml tests scripts/verify_stack.py scripts/export_workbench.py scripts/smoke_public.py
      - run: python -m pytest -q --disable-warnings
      - run: python -m scripts.export_workbench --check
      - run: python -m scripts.render_docs && git diff --exit-code -- docs/FinGraph_Research_and_Architecture.html
      - run: node --check app.js && node --check lab.js
      - run: node --test tests/workbench.test.cjs
      - run: python -m compileall -q api pipeline ml
  kafka-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start intake with graph projection offline
        run: docker compose up --build -d api worker
      - name: Publish source events
        run: docker compose run --rm worker python -m pipeline.cli publish
      - name: Verify cases commit while projection is offline
        run: docker compose exec -T worker python -m scripts.verify_stack --intake-only --check-offsets
      - name: Start projector and drain the outbox
        run: docker compose up --build -d projector
      - name: Verify ingestion, projection and review
        run: |
          docker compose exec -T worker python -m scripts.verify_stack
          docker compose exec -T projector python -c 'from pathlib import Path; entries = list(Path("var/graphs").glob("*.nt")); assert len(entries) == 5 and all(p.stat().st_size > 0 for p in entries)'
      - name: Restart worker and replay events
        run: |
          docker compose restart worker
          docker compose run --rm worker python -m pipeline.cli publish
          docker compose exec -T worker python -m scripts.verify_stack --check-offsets
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail=150
      - name: Stop services
        if: always()
        run: docker compose down -v

name: Deploy verified Vercel release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --disable-warnings
      - run: node --check app.js && node --check lab.js
      - name: Validate deployment configuration
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - name: Build and publish
        run: |
          npx --yes vercel@48.9.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@48.9.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@48.9.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deployment-url.txt
      - name: Verify live API
        run: |
          DEPLOY_URL=$(tail -n 1 deployment-url.txt)
          curl --fail --retry 3 "$DEPLOY_URL/api/health"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-url
          path: deployment-url.txt

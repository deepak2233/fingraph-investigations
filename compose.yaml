services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fingraph
      POSTGRES_USER: fingraph
      POSTGRES_PASSWORD: localdev
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingraph"]
      interval: 5s
      retries: 12
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      retries: 12
  topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "fingraph.cases.v1", "--partitions", "3", "--replication-factor", "1"]
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://fingraph:localdev@postgres:5432/fingraph
    depends_on:
      postgres: {condition: service_healthy}
    command: ["python", "-m", "pipeline.cli", "init-db"]
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://fingraph:localdev@postgres:5432/fingraph
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    command: ["python", "-m", "pipeline.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://fingraph:localdev@postgres:5432/fingraph
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      migrate: {condition: service_completed_successfully}
      topic-init: {condition: service_completed_successfully}
    restart: on-failure
  projector:
    build: .
    command: ["python", "-m", "pipeline.projector"]
    environment:
      DATABASE_URL: postgresql+psycopg://fingraph:localdev@postgres:5432/fingraph
      NEPTUNE_ENDPOINT: ${NEPTUNE_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes: ["graphs:/app/var"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: on-failure
volumes:
  postgres:
  graphs:
